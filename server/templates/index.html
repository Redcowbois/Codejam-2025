<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Workout Tracker</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
</head>

<body>

<div id="cameraSection">
    <div id="cameraWrapper">
        <img id="cameraFeed" src="/video_feed">
        <div id="overlayCounter">Reps: 0</div>
        <div id="overlayRest">Rest: Not Started</div>
    </div>
</div>

<!-- SIDEBAR -->
<div id="sidebar">
    <div class="section">
        <h1>Sunday Workout Plan</12>
        <div id="titleBox">  
            <h2>Current Exercise: Bicep Curl</h2>
        </div>
    </div>

<!-- EXERCISE LIST BOX -->
    <div id="exerciseListBox">
        <h3>Exercises</h3>

        <div class="exercise" data-total-sets="3" data-remaining-sets="3">
            <span class="exercise-name">Lateral Raises</span>
            <div class="sets-bar"></div>
            <span class="sets-text">Sets left: 3/3</span>
        </div>

        <div class="exercise" data-total-sets="3" data-remaining-sets="3">
            <span class="exercise-name">Bicep Curls</span>
            <div class="sets-bar"></div>
            <span class="sets-text">Sets left: 3/3</span>
        </div>
    </div>

    <!-- CURRENT EXERCISE BOX -->
    <div id="currentExerciseBox">
        <h3>Form Feedback</h3>
        <p id="currentExercise">Bicep Curl</p>
    </div>
</div>

<script>
const socket = io("http://localhost:5000");

/* Rep counter with pop animation */
socket.on("counter", value => {
    const counterEl = document.getElementById("overlayCounter");
    const encouragement_rep_counts = [3,8,9]
    if (counterEl.textContent != value) {
        counterEl.textContent = "Reps: " + value;
        counterEl.classList.add("pop");
        setTimeout(() => counterEl.classList.remove("pop"), 250);
    }
    
    if (encouragement_rep_counts.includes(value)) {
        fetch("/encourage", { 
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ reps: value })
        })
        .then(response => response.json())
        .then(data => {
            console.log("API response:", data);
        })
        .catch(err => console.error("API error:", err));
    }
});

/* Update current exercise text */
socket.on("type", newText => {
    document.getElementById("currentExercise").textContent = newText;
});

/* Rest timer */
let restInterval = null;
socket.on("start_rest_timer_client", data => {
    const restBox = document.getElementById("overlayRest");
    let remaining = data.duration;

    if (restInterval) clearInterval(restInterval);

    restBox.textContent = `Rest: ${remaining}s`;

    restInterval = setInterval(() => {
        remaining--;
        restBox.textContent = `Rest: ${remaining}s`;

        if (remaining <= 0) {
            clearInterval(restInterval);
            restBox.textContent = "Rest Finished!";
        }
    }, 1000);
});

function initExerciseSegments() {
    const exercises = document.querySelectorAll(".exercise");
    exercises.forEach(ex => {
        const totalSets = parseInt(ex.dataset.totalSets);
        const setsBar = ex.querySelector(".sets-bar");

        // Clear any previous segments
        setsBar.innerHTML = "";

        for (let i = 0; i < totalSets; i++) {
            const segment = document.createElement("div");
            segment.classList.add("set-segment");
            if (i < parseInt(ex.dataset.remainingSets)) {
                segment.classList.add("completed"); // filled initially
            }
            setsBar.appendChild(segment);
        }

        // Set initial text
        const textEl = ex.querySelector(".sets-text");
        textEl.textContent = `Sets left: ${ex.dataset.remainingSets}/${totalSets}`;
    });
}

// Call this once on page load
initExerciseSegments();

// Function to update sets
function updateExerciseSets(exerciseName, remainingSets) {
    const exercises = document.querySelectorAll(".exercise");
    exercises.forEach(ex => {
        if (ex.querySelector(".exercise-name").textContent === exerciseName) {
            const totalSets = parseInt(ex.dataset.totalSets);
            ex.dataset.remainingSets = remainingSets;

            const segments = ex.querySelectorAll(".set-segment");
            segments.forEach((seg, idx) => {
                if (idx < remainingSets) {
                    seg.classList.add("completed");
                } else {
                    seg.classList.remove("completed");
                }
            });

            const textEl = ex.querySelector(".sets-text");
            textEl.textContent = `Sets left: ${remainingSets}/${totalSets}`;
        }
    });
}

// Example: fetch updates from server/socket
socket.on("update_sets", data => {
    // data: { exercise: "Bicep Curls", remaining: 2 }
    updateExerciseSets(data.exercise, data.remaining);
});

</script>

</body>
</html>
