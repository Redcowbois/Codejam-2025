<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Workout Tracker</title>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

<style>
    body {
        margin: 0;
        font-family: "Inter", Arial, sans-serif;
        background-color: #0f1115;
        color: white;
        display: flex;
        height: 100vh;
        overflow: hidden;
    }

    /* LEFT CAMERA AREA */
    #cameraSection {
        flex: 3;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #1a1d24;
    }

    #cameraWrapper {
        position: relative;
        width: 90%;
        max-width: 1000px;
        border-radius: 20px;
        overflow: hidden; /* ensures overlays and camera corners match */
    }

    #cameraFeed {
        width: 100%;
        display: block;
        object-fit: cover;
        transform: scaleX(-1); /* flip camera */
    }

    /* OVERLAYS */
    #overlayCounter, #overlayRest {
        position: absolute;
        padding: 12px 20px;
        background: rgba(0, 0, 0, 0.45);
        border-radius: 14px;
        box-shadow: 0 4px 14px rgba(0,0,0,0.4);
        backdrop-filter: blur(10px);
        font-weight: 700;
        z-index: 10;
    }

    /* Rep counter → top-left inside camera box */
    #overlayCounter {
        top: 15px;
        left: 15px;
        font-size: 60px;
        color: #2b7de9;
        transition: transform 0.25s ease;
    }

    /* Rest timer → top-right inside camera box */
    #overlayRest {
        top: 15px;
        right: 15px;
        font-size: 32px;
        color: #91b4ff;
    }

    /* Pop animation for reps */
    .pop {
        transform: scale(1.25);
    }

    /* SIDEBAR */
    #sidebar {
        flex: 1;
        background: #13161d;
        padding: 30px;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        box-shadow: -4px 0 10px rgba(0,0,0,0.4);
    }

    h2, h3 { margin-top: 0; }

    .section { margin-bottom: 30px; }

    .exercise-list div {
        background: #1e222b;
        padding: 10px;
        border-radius: 6px;
        margin-top: 8px;
        cursor: pointer;
        transition: 0.2s;
    }

    .exercise-list div:hover { background: #2b7de9; }

    .selected { background: #2b7de9 !important; }
</style>
</head>

<body>

<div id="cameraSection">
    <div id="cameraWrapper">
        <img id="cameraFeed" src="/video_feed">
        <div id="overlayCounter">0</div>
        <div id="overlayRest">Rest: Not Started</div>
    </div>
</div>

<div id="sidebar">

    <div class="section">
        <h2>Workout: Push / Pull / Legs</h2>
        <h3>Current Exercise: Bicep Curl</h3>
        <p>Set 1 / 3 — Reps Goal: 12</p>
    </div>

    <div class="section exercise-list">
        <h3>Exercises</h3>
        <div>Push Ups (3×10)</div>
        <div>Squats (3×12)</div>
        <div>Rows (3×10)</div>
        <div class="selected">Bicep Curls (3×10)</div>
    </div>

    <div class="section">
        <h3>Current Exercise:</h3>
        <p id="currentExercise">Bicep Curl</p>
    </div>

</div>

<script>
const socket = io("http://localhost:5000");

/* Rep counter with pop animation */
socket.on("counter", value => {
    const counterEl = document.getElementById("overlayCounter");
    if (counterEl.textContent != value) {
        counterEl.textContent = value;
        counterEl.classList.add("pop");
        setTimeout(() => counterEl.classList.remove("pop"), 250);
    }
});

/* Update current exercise text */
socket.on("type", newText => {
    document.getElementById("currentExercise").textContent = newText;
});

/* Rest timer */
let restInterval = null;
socket.on("start_rest_timer_client", data => {
    const restBox = document.getElementById("overlayRest");
    let remaining = data.duration;

    if (restInterval) clearInterval(restInterval);

    restBox.textContent = `Rest: ${remaining}s`;

    restInterval = setInterval(() => {
        remaining--;
        restBox.textContent = `Rest: ${remaining}s`;

        if (remaining <= 0) {
            clearInterval(restInterval);
            restBox.textContent = "Rest Finished!";
        }
    }, 1000);
});
</script>

</body>
</html>
